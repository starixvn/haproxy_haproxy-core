frontend proxygw_fe from http_defaults
  bind *:80
  bind *:8088
  stats uri /stats
  stats auth lumi:lum!onRock
  monitor-uri	/checkstatus
  mode http
  option forwardfor
  option httplog
  # option dontlog-normal
  capture request header Host len 30
  capture request header User-Agent len 200
  capture request header Referer len 800
  capture request header X-Forwarded-For len 20
  option http-keep-alive
  use_backend %[path,lower,map_reg(/etc/haproxy/maps/l1-proxy-domain.map)] if { hdr(host) -i proxy.sabagame.com proxy.gamesaba.com client.sabagame.com client.gamesaba.com }
  use_backend %[path,lower,map_reg(/etc/haproxy/maps/l2-proxy-domain.map)] if { hdr(host) -i proxy.vgaming.win proxy2.vgaming.win client.vgaming.win client2.vgaming.win proxy.vgames88.com proxy.playvgames.com client.vgames88.com client.playvgames.com }
  use_backend %[path,lower,map_reg(/etc/haproxy/maps/l1-services-domain.map)] if { hdr(host) -i services.sabagame.com services.gamesaba.com }
  use_backend %[path,lower,map_reg(/etc/haproxy/maps/l2-services-domain.map)] if { hdr(host) -i services.vgaming.win services2.vgaming.win services.vgames88.com services.playvgames.com }
  use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/maps/hosts.map)]

default_backend default_backend_nodes

backend default_backend_nodes from http_defaults
  mode http
  http-request return status 503 content-type "text/plain" lf-string "Prod Proxy GW - 503 Service Unavailable ! Pls contact NexOps if you think this is a mistake..."
