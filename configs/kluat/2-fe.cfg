frontend proxygw_fe from http_defaults
  bind *:80
  bind *:8088
  stats uri /stats
  stats auth lumi:lum!onRock
  monitor-uri	/checkstatus
  mode http
  option httplog
  capture request header Host len 30
  capture request header User-Agent len 200
  capture request header Referer len 800
  capture request header X-Forwarded-For len 20
  option http-keep-alive
  ###
  acl is_whitelisted_ip src -f /etc/haproxy/whitelisted.ips
  acl internal_domains hdr(host) -i eks-ingress.sgamesuat.com deployapi-eks.sgamesuat.com
  http-request deny if internal_domains !is_whitelisted_ip
  use_backend %[path,lower,map_reg(/etc/haproxy/maps/l1-proxy-domain.map)] if { hdr(host) -i l1uatclient.sgamesuat.com }
  use_backend %[path,lower,map_reg(/etc/haproxy/maps/l2-proxy-domain.map)] if { hdr(host) -i l2uatclient.sgamesuat.com }
  use_backend %[path,lower,map_reg(/etc/haproxy/maps/l1-services-domain.map)] if { hdr(host) -i l1uatservices.sgamesuat.com }
  use_backend %[path,lower,map_reg(/etc/haproxy/maps/l2-services-domain.map)] if { hdr(host) -i l2uatservices.sgamesuat.com }
  use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/maps/hosts.map)]

default_backend default_backend_nodes

backend default_backend_nodes from http_defaults
  mode http
  http-request return status 503 content-type "text/plain" lf-string "UAT Proxy GW - 503 Service Unavailable ! Pls contact NexOps if you think this is a mistake..."

backend empty_backend_nodes from http_defaults
  http-request return status 200 content-type "text/plain"  lf-string "UAT Proxy GW - healthy"
