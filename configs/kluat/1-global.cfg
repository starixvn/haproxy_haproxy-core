global
  log 10.88.116.19:30161 len 8096 local2 #local0 
  stats socket /var/run/haproxy.sock mode 600 expose-fd listeners level user
  #server-state-file /var/lib/haproxy/server-state
  chroot /var/lib/haproxy
  user haproxy
  group haproxy
  daemon

defaults
  log global
  mode http
  option httplog
  option dontlognull
  timeout connect 5000
  timeout client 50000
  timeout server 50000
  errorfile 400 /etc/haproxy/errors/400.http
  errorfile 403 /etc/haproxy/errors/403.http
  errorfile 408 /etc/haproxy/errors/408.http
  errorfile 500 /etc/haproxy/errors/500.http
  errorfile 502 /etc/haproxy/errors/502.http
  errorfile 503 /etc/haproxy/errors/503.http
  errorfile 504 /etc/haproxy/errors/504.http

defaults tcp_defaults
  log global
  mode tcp
  maxconn 10000
  timeout client-fin 5s
  timeout server-fin 5s
  retries 3
  option redispatch
  timeout connect 10s
  timeout client 5m
  timeout server 5m
  timeout tunnel        3600s
  timeout http-keep-alive  1s
  timeout http-request    15s
  timeout queue           30s
  timeout tarpit          60s

defaults http_defaults
  log global
  mode http
  #load-server-state-from-file global
  option httplog
  option dontlognull
  #option dontlog-normal
  balance source
  maxconn 10000
  option forwardfor #except 10.0.101.94
  option httpchk
  option redispatch
  timeout connect 10s
  timeout client 5m
  timeout server 5m
  timeout http-keep-alive 1s
  timeout http-request 15s
  timeout queue 30s
  errorfile 400 /etc/haproxy/errors/400.http
  errorfile 403 /etc/haproxy/errors/403.http
  errorfile 408 /etc/haproxy/errors/408.http
  errorfile 500 /etc/haproxy/errors/500.http
  errorfile 502 /etc/haproxy/errors/502.http
  errorfile 503 /etc/haproxy/errors/503.http
  http-check expect status 200 #200-399

frontend status-monitor from http_defaults
  bind *:8080
  mode http
  maxconn 20
  stats refresh 300s
  stats show-legends
  stats show-node
  option forwardfor
  capture request header Host len 30
  capture request header User-Agent len 200
  capture request header Referer len 800
  capture request header X-Forwarded-For len 20
  stats uri /
  monitor-uri /checkstatus
  stats auth lumi:lum!onRock
default_backend empty_backend_nodes
