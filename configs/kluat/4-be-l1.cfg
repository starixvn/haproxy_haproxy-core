backend l1_appdownload_uat_be from http_defaults
  http-request set-header Host l1uatdl.foodpandaoh.net
  http-request set-header X-Forwarded-For %[src]
  #http-check connect default proto h1
  #option httpchk GET /health HTTP/1.1
  http-check send meth GET uri /health hdr Host "l1uatdl.foodpandaoh.net"
  http-check expect status 200
  server cluster_kbt_uat l1uatdl.foodpandaoh.net:80 check #KBT l1uatcli.foodpandaoh.net:80
  #server cluster_aws_uat 10.77.15.173:80 check inter 5s fall 3 rise 3 #AWS
  server cluster_aws_eks a1a5f1f90489c4607a1b27e81726621b-2f32f94ace73412c.elb.ap-northeast-1.amazonaws.com:80 check inter 2s fall 2 rise 3

